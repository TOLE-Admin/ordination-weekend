<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordination Weekend: Kitchen Lists</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&display=swap">
  <!--
    Ken's kitchen lists for Ordination Weekend (GitHub page)
    Lives at: https://tole-admin.github.io/ordination-weekend/kitchen.html
    PUBLIC FILE: no lists or codes in here. Everything comes from the Google
    Apps Script, only when the link carries Ken's kitchen code after the #.
  -->
  <style>
    :root {
      --navy: #1a1f55; --navy-glow: #2b2f73; --copper: #c27b3a; --amber: #f0a54a;
      --gold: #ffd690; --cream: #fff8ef; --ink: #2d2a3e; --muted: #6e6a84; --line: #ecd9c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 12px 48px; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 0, var(--navy-glow) 0, var(--navy) 420px) fixed, var(--navy);
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    header { text-align: center; padding: 18px 0 10px; }
    h1 { font-family: "EB Garamond", Georgia, serif; font-weight: 600; font-size: 28px; margin: 0; color: var(--gold); }

    /* The tab slider */
    .tabs {
      position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; padding: 5px;
      background: rgba(16,20,63,.92); border: 1px solid rgba(240,165,74,.35); border-radius: 16px; margin: 6px 0 12px;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .tab {
      flex: 1; min-height: 44px; border: 0; border-radius: 12px; background: transparent; color: #d9d6ee;
      font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--copper); color: #fff; }
    .tab:focus-visible { outline: 3px solid var(--amber); outline-offset: 1px; }

    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 2px 10px; min-height: 22px; }
    #status { font-size: 13px; color: #a7a4c9; }
    #status.bad { color: #ffb4a0; font-weight: 700; }
    .print-btn {
      border: 1px solid rgba(240,165,74,.6); background: transparent; color: var(--gold); border-radius: 10px;
      min-height: 40px; padding: 6px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    }

    .card { background: var(--cream); border-radius: 18px; padding: 16px 14px; margin-bottom: 14px; box-shadow: 0 8px 26px rgba(0,0,0,.25); }
    h2 { font-family: "EB Garamond", Georgia, serif; font-weight: 600; font-size: 24px; color: var(--navy); margin: 0 0 6px; }
    .group { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--copper); margin: 14px 0 4px; }
    .head { display: grid; grid-template-columns: 34px 1fr 108px 34px; gap: 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 0 2px; }

    /* One line: checkbox · item · amount · remove */
    .row { display: grid; grid-template-columns: 34px 1fr 108px 34px; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--line); }
    .row input[type=checkbox] { width: 24px; height: 24px; margin: 0 auto; accent-color: var(--copper); }
    .row input[type=text], .row textarea {
      width: 100%; min-height: 40px; resize: none; overflow: hidden; line-height: 1.3; display: block; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px;
      font: inherit; font-size: 16px; color: var(--ink); background: transparent;   /* 16px: no iPhone zoom */
    }
    .row input[type=text]:focus, .row textarea:focus { outline: none; border-color: var(--copper); background: #fff; }
    .row .amt { color: var(--copper); font-weight: 600; }
    .row.done .itm { text-decoration: line-through; color: #9c95a8; }
    .row.add input[type=text] { border: 1px dashed #d9c3ab; background: #fff; }
    .del {
      width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #b9a99a;
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    .del:hover, .del:focus-visible { background: #f6e6d6; color: #a23a22; outline: none; }
    .row.saving { opacity: .7; }

    .loading { text-align: center; color: var(--muted); padding: 18px 0; }
    .error { color: #a23a22; background: #fbe6dd; border-radius: 10px; padding: 10px 14px; font-size: 14px; }
    .btn { background: var(--copper); color: #fff; border: 0; border-radius: 12px; min-height: 44px; padding: 10px 18px; font: inherit; font-weight: 700; margin-top: 10px; cursor: pointer; }
    [hidden] { display: none !important; }

    /* Printing: all three lists, plain and compact */
    @media print {
      body { background: #fff; padding: 0; color: #000; }
      header, .tabs, .bar, .del, #noAccess { display: none !important; }
      .panel { display: block !important; }
      .card { box-shadow: none; border-radius: 0; padding: 0; margin: 0 0 14px; background: #fff; break-inside: auto; }
      h2 { color: #000; font-size: 20px; border-bottom: 2px solid #000; margin-top: 8px; }
      .group { color: #000; margin-top: 8px; }
      .head, .row { grid-template-columns: 24px 1fr 150px; }
      .head span:last-child { display: none; }
      .row { padding: 0; border-bottom: 1px solid #bbb; break-inside: avoid; }
      .row input[type=text], .row textarea { min-height: 22px; padding: 2px 4px; font-size: 13px; color: #000; }
      .row .amt { color: #000; }
      .row.add input[type=text] { border: 0; }
      .row.add input::placeholder { color: transparent; }
      .row input[type=checkbox] { width: 14px; height: 14px; }
      #panel-shopping { page-break-after: always; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header><h1>Ordination Weekend: Kitchen</h1></header>

    <div class="card" id="noAccess" hidden>
      <h2>This page needs Ken's kitchen link</h2>
      <p style="margin:0;color:var(--muted)">Open it from the saved link that ends in a # code.</p>
    </div>

    <div id="app" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-shopping" aria-selected="true" aria-controls="panel-shopping">Shopping</button>
        <button class="tab" role="tab" id="tab-menu" aria-selected="false" aria-controls="panel-menu">Menu</button>
        <button class="tab" role="tab" id="tab-equipment" aria-selected="false" aria-controls="panel-equipment">Equipment</button>
      </div>
      <div class="bar">
        <span id="status" role="status">Loading…</span>
        <button type="button" class="print-btn" id="printBtn">Print</button>
      </div>

      <div id="loadError" class="card" hidden>
        <p class="error" id="loadErrorMsg" style="margin:0"></p>
        <button type="button" class="btn" id="retryBtn">Try again</button>
      </div>

      <section class="panel" id="panel-shopping" role="tabpanel">
        <div class="card"><h2>Shopping List: Food</h2><div id="list-Food"></div></div>
        <div class="card"><h2>Shopping List: Supplies</h2><div id="list-Supplies"></div></div>
      </section>
      <section class="panel" id="panel-menu" role="tabpanel" hidden>
        <div class="card"><h2>Menu</h2><div id="list-Menu"></div></div>
      </section>
      <section class="panel" id="panel-equipment" role="tabpanel" hidden>
        <div class="card"><h2>Equipment Needed</h2><div id="list-Equipment"></div></div>
      </section>
    </div>
  </div>

  <script>
    // Same Google Apps Script as the guest sign-up page.
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEtwPMZRZIXtuZOMJ1gZ8EXX_fltgSxkctYq4QZbpOMRWVo_2HcyvtL-QFl7qdVkbw/exec';
    var REFRESH_MS = 30000;

    // What the checkbox and the second box mean on each list
    var LISTS = {
      Food:      { check: 'Bought', amount: 'Amount', addGroup: 'Added' },
      Supplies:  { check: 'Bought', amount: 'Amount', addGroup: '' },
      Menu:      { check: 'Made',   amount: 'Note',   addGroup: 'Added' },
      Equipment: { check: 'Packed', amount: 'Who / note', addGroup: '' }
    };

    var KEY = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
    var lines = [];      // everything from the Sheet
    var pending = 0;     // saves still on their way
    var failed = false;

    function $(id) { return document.getElementById(id); }

    function callScript(fn, args) {
      var url = SCRIPT_URL + '?fn=' + encodeURIComponent(fn) +
        '&args=' + encodeURIComponent(JSON.stringify([KEY].concat(args || [])));
      return fetch(url, { method: 'GET', credentials: 'omit', redirect: 'follow' })
        .then(function (r) {
          if (!r.ok) throw new Error('The server answered with an error (' + r.status + ').');
          return r.json();
        })
        .then(function (res) {
          if (!res || !res.ok) throw new Error((res && res.error) || 'Something went wrong.');
          return res.data;
        });
    }

    function setStatus(msg, bad) {
      var el = $('status');
      el.textContent = msg;
      el.className = bad ? 'bad' : '';
    }

    // ---------- Tabs ----------
    ['shopping', 'menu', 'equipment'].forEach(function (name) {
      $('tab-' + name).addEventListener('click', function () { showTab(name); });
    });
    function showTab(name) {
      ['shopping', 'menu', 'equipment'].forEach(function (n) {
        $('tab-' + n).setAttribute('aria-selected', String(n === name));
        $('panel-' + n).hidden = n !== name;
      });
      fitAll($('panel-' + name));
      try { localStorage.setItem('kitchenTab', name); } catch (e) {}
    }

    // ---------- Drawing the lists ----------
    function render() {
      Object.keys(LISTS).forEach(function (list) {
        var box = $('list-' + list);
        box.innerHTML = '';
        var cfg = LISTS[list];
        var head = document.createElement('div');
        head.className = 'head';
        head.innerHTML = '<span></span><span></span><span></span><span></span>';
        head.children[1].textContent = 'Item (tick when ' + cfg.check.toLowerCase() + ')';
        head.children[2].textContent = cfg.amount;
        box.appendChild(head);

        var mine = lines.filter(function (l) { return l.list === list; });
        var lastGroup = null;
        mine.forEach(function (l) {
          if (l.group !== lastGroup) {
            lastGroup = l.group;
            if (l.group) {
              var g = document.createElement('div');
              g.className = 'group';
              g.textContent = l.group;
              box.appendChild(g);
            }
          }
          box.appendChild(makeRow(l, cfg));
        });
        box.appendChild(makeAddRow(list, cfg));
      });
      fitAll();
    }

    // Grows an item box so long names wrap instead of getting cut off
    function fit(t) {
      if (!t.offsetParent) return;   // hidden tab: sized when it opens
      t.style.height = 'auto';
      t.style.height = t.scrollHeight + 'px';
    }
    // Sizes every item box on the open tab (or the whole page), right away
    function fitAll(root) {
      Array.prototype.forEach.call((root || document).querySelectorAll('.row textarea'), fit);
    }

    function makeRow(l, cfg) {
      var row = document.createElement('div');
      row.className = 'row' + (l.done ? ' done' : '');

      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = l.done;
      cb.setAttribute('aria-label', cfg.check + ': ' + l.item);
      var itm = document.createElement('textarea');
      itm.rows = 1; itm.className = 'itm'; itm.value = l.item;
      itm.addEventListener('input', function () { fit(itm); });
      itm.setAttribute('aria-label', 'Item');
      var amt = document.createElement('textarea');
      amt.rows = 1; amt.className = 'amt'; amt.value = l.amount;
      amt.addEventListener('input', function () { fit(amt); });
      amt.setAttribute('aria-label', cfg.amount + ' for ' + l.item);
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×';
      del.setAttribute('aria-label', 'Remove ' + l.item);

      function save() {
        if (!l.id) { setTimeout(save, 700); return; }   // a brand-new line is still being saved
        var name = itm.value.trim();
        if (!name) { itm.value = l.item; return; }   // an item can't be blank; use × to remove
        if (name === l.item && amt.value.trim() === l.amount && cb.checked === l.done) return;
        l.item = name; l.amount = amt.value.trim(); l.done = cb.checked;
        row.classList.toggle('done', l.done);
        send('kitchenSave', [{ id: l.id, list: l.list, group: l.group, item: l.item, amount: l.amount, done: l.done }], row);
      }
      cb.addEventListener('change', save);
      itm.addEventListener('change', save);
      amt.addEventListener('change', save);
      [itm, amt].forEach(function (inp) {   // Enter finishes the line (no new lines inside an item)
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
      });
      del.addEventListener('click', function () {
        lines = lines.filter(function (x) { return x !== l; });
        row.remove();
        send('kitchenDelete', [l.id]);
      });

      row.appendChild(cb); row.appendChild(itm); row.appendChild(amt); row.appendChild(del);
      return row;
    }

    // The blank line at the bottom of each list. Fill in an item and a new one appears.
    function makeAddRow(list, cfg) {
      var row = document.createElement('div');
      row.className = 'row add';
      var spacer = document.createElement('span');
      var itm = document.createElement('input');
      itm.type = 'text'; itm.placeholder = '+ Add an item';
      itm.setAttribute('aria-label', 'Add an item to ' + list);
      var amt = document.createElement('input');
      amt.type = 'text'; amt.className = 'amt'; amt.placeholder = cfg.amount;
      amt.setAttribute('aria-label', cfg.amount + ' for the new item');

      function add() {
        var name = itm.value.trim();
        if (!name) return;
        var l = { id: '', list: list, group: cfg.addGroup, item: name, amount: amt.value.trim(), done: false };
        itm.value = ''; amt.value = '';
        lines.push(l);
        render();
        // Keep typing: focus the new blank line
        var blanks = $('list-' + list).querySelectorAll('.row.add input');
        if (blanks[0]) blanks[0].focus();
        send('kitchenSave', [l]).then(function (res) { if (res && res.id) l.id = res.id; });
      }
      itm.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (itm.value.trim()) amt.focus(); } });
      amt.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
      itm.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== amt) add(); }, 150); });
      amt.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== itm) add(); }, 150); });

      row.appendChild(spacer); row.appendChild(itm); row.appendChild(amt); row.appendChild(document.createElement('span'));
      return row;
    }

    // ---------- Saving ----------
    function send(fn, args, row) {
      pending++;
      failed = false;
      setStatus('Saving…');
      if (row) row.classList.add('saving');
      return callScript(fn, args)
        .then(function (res) {
          pending--;
          if (row) row.classList.remove('saving');
          if (!pending && !failed) setStatus('All changes saved');
          return res;
        })
        .catch(function (err) {
          pending--;
          failed = true;
          if (row) row.classList.remove('saving');
          if (err.message === 'NO_ACCESS') { showNoAccess(); return; }
          setStatus("A change didn't save. Check your signal and make it again. (" + err.message + ')', true);
        });
    }

    // ---------- Loading and refreshing ----------
    function load(quiet) {
      if (!quiet) { setStatus('Loading…'); $('loadError').hidden = true; }
      return callScript('kitchenGet')
        .then(function (data) {
          // Don't redraw under your fingers: skip if you're typing or a save is on its way
          var typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
          if (quiet && (pending || typing)) return;
          lines = (data && data.lines) || [];
          render();
          if (!pending && !failed) setStatus('All changes saved');
        })
        .catch(function (err) {
          if (err.message === 'NO_ACCESS') { showNoAccess(); return; }
          if (quiet) return;
          $('loadErrorMsg').textContent = "Couldn't load your lists. Check your connection and try again. (" + err.message + ')';
          $('loadError').hidden = false;
          setStatus('');
        });
    }

    function showNoAccess() { $('app').hidden = true; $('noAccess').hidden = false; }

    $('retryBtn').addEventListener('click', function () { load(false); });
    $('printBtn').addEventListener('click', function () { window.print(); });

    // Before printing, open every tab for a moment so all boxes get sized
    var openTab = 'shopping';
    window.addEventListener('beforeprint', function () {
      ['shopping', 'menu', 'equipment'].forEach(function (n) {
        if ($('tab-' + n).getAttribute('aria-selected') === 'true') openTab = n;
        $('panel-' + n).hidden = false;
      });
      fitAll();
    });
    window.addEventListener('afterprint', function () { showTab(openTab); });
    // Turning the phone changes the width, so re-size
    window.addEventListener('resize', function () { fitAll(); });

    if (!KEY) {
      showNoAccess();
    } else {
      $('app').hidden = false;
      try { var t = localStorage.getItem('kitchenTab'); if (t) showTab(t); } catch (e) {}
      load(false);
      setInterval(function () { if (!document.hidden) load(true); }, REFRESH_MS);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) load(true); });
    }
  </script>
</body>
</html>
